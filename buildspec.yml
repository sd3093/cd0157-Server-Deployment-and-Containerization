---
version: 0.2


phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      # Docker runs in privileged mode on the CodeBuild standard image; wait until the daemon answers
      - timeout 15 sh -c "until docker info > /dev/null; do echo .; sleep 1; done"
      # You must use a kubectl version that is within one minor version difference of your Amazon EKS cluster control plane.
      # The EKS cluster simple-jwt-api runs Kubernetes 1.36, so install kubectl v1.36.0.
      # Ref: https://kubernetes.io/docs/tasks/tools/install-kubectl-linux/
      - curl -sSLO https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl
      # Download the kubectl checksum file and validate the binary against it
      - curl -sSLO https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl.sha256
      - echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
      # Install kubectl
      - chmod +x ./kubectl
      - export PATH=$PWD/:$PATH
      - python --version
      - echo 'export PATH=$PWD/:$PATH' >> $HOME/.bashrc
      - kubectl version --client
      - aws --version
      - python -m pip install --upgrade pip
  pre_build:
    commands:
      # Install the requirements and run the unit tests: a failing test stops the build before deployment
      - pip install -r requirements.txt
      - python -m pytest test_main.py
      - TAG="$REPOSITORY_NAME.$REPOSITORY_BRANCH.$(date +%Y-%m-%d.%H.%M.%S).$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | head -c 8)"
      - sed -i 's@CONTAINER_IMAGE@'"$REPOSITORY_URI:$TAG"'@' simple_jwt_api.yml
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin ${REPOSITORY_URI%%/*}
      - export KUBECONFIG=$HOME/.kube/config
      - echo `ls -l`
  build:
    commands:
      - docker build --tag $REPOSITORY_URI:$TAG .

  post_build:
    commands:
      - docker push $REPOSITORY_URI:$TAG
      - echo $EKS_CLUSTER_NAME
      - echo $EKS_KUBECTL_ROLE_ARN
      - aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --role-arn $EKS_KUBECTL_ROLE_ARN
      # Hand the JWT_SECRET from the parameter store to the pods as a Kubernetes secret (see simple_jwt_api.yml)
      - kubectl create secret generic jwt-secret --from-literal=JWT_SECRET="$JWT_SECRET" --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f simple_jwt_api.yml
      - kubectl rollout status deployment/simple-jwt-api --timeout=300s
      - printf '[{"name":"simple_jwt_api","imageUri":"%s"}]' $REPOSITORY_URI:$TAG > build.json
artifacts:
  files: build.json
env:
  parameter-store:
    JWT_SECRET: JWT_SECRET
