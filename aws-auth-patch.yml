# aws-auth ConfigMap of the simple-jwt-api cluster (kubectl get -n kube-system configmap/aws-auth -o yaml),
# with the CodeBuild kubectl role mapped to system:masters. Applied with:
#   eksctl create iamidentitymapping --cluster simple-jwt-api --region us-east-2 \
#     --arn arn:aws:iam::760216051599:role/UdacityFlaskDeployCBKubectlRole --group system:masters --username build
# (equivalent to: kubectl patch configmap/aws-auth -n kube-system --patch "$(cat aws-auth-patch.yml)")

apiVersion: v1
data:
  mapRoles: |
    - groups:
      - system:bootstrappers
      - system:nodes
      rolearn: arn:aws:iam::760216051599:role/eksctl-simple-jwt-api-nodegroup-ng-NodeInstanceRole-OokUOeliwg5k
      username: system:node:{{EC2PrivateDNSName}}
    - groups:
      - system:masters
      rolearn: arn:aws:iam::760216051599:role/UdacityFlaskDeployCBKubectlRole
      username: build
  mapUsers: |
    []
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
